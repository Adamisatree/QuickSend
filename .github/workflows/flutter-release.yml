name: Publish QuickSend v2.1 preview

on:
  push:
    tags: ['v2.1.0']

permissions:
  contents: read

concurrency:
  group: quicksend-v2.1-release
  cancel-in-progress: false

jobs:
  build:
    name: Build · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            flutter_arch: x64
            flutter_os: linux
          - os: ubuntu-24.04-arm
            target: linux-arm64
            flutter_arch: arm64
            flutter_os: linux
          - os: windows-latest
            target: windows-x64
            flutter_arch: x64
            flutter_os: windows
          - os: windows-11-arm
            target: windows-arm64
            flutter_arch: arm64
            flutter_os: windows
          - os: macos-latest
            target: macos-apple-silicon
            flutter_arch: arm64
            flutter_os: macos
          - os: macos-15-intel
            target: macos-intel
            flutter_arch: x64
            flutter_os: macos
          - os: ubuntu-latest
            target: android-apk
            flutter_arch: x64
            flutter_os: linux
    defaults:
      run:
        working-directory: client
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install jq on ARM Linux runner
        if: runner.os == 'Linux' && matrix.flutter_arch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Install jq on ARM Windows runner
        if: runner.os == 'Windows' && matrix.flutter_arch == 'arm64'
        run: choco install jq -y
      - name: Resolve stable Flutter tag for non-macOS ARM runners
        id: flutter-version
        if: runner.os != 'macOS' && matrix.flutter_arch == 'arm64'
        shell: bash
        run: |
          manifest_os=${{ matrix.flutter_os }}
          version=$(curl --fail --silent --show-error --location \
            "https://storage.googleapis.com/flutter_infra_release/releases/releases_${manifest_os}.json" \
            | jq -r '[.releases[] | select(.channel == "stable")][0].version')
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "Could not resolve the latest stable Flutter tag for $manifest_os" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Using Flutter release tag $version from source."
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ runner.os != 'macOS' && matrix.flutter_arch == 'arm64' && 'master' || 'stable' }}
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          architecture: ${{ matrix.flutter_arch }}
          cache: true
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux' && matrix.target != 'android-apk'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Install Inno Setup compiler
        if: startsWith(matrix.target, 'windows-')
        run: choco install innosetup -y --no-progress
      - uses: actions/setup-java@v6
        if: matrix.target == 'android-apk'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        if: matrix.target == 'android-apk'
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Generate native runner projects and LAN permissions
        run: bash tool/bootstrap_platforms.sh
      - run: flutter pub get
      - name: Analyze Flutter client
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter tests with failure diagnostics
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee "$RUNNER_TEMP/flutter-test.txt"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error title=Flutter test detail::$line"
            done < "$RUNNER_TEMP/flutter-test.txt"
          fi
          exit "$status"
      - name: Build release app
        if: matrix.target != 'android-apk'
        run: |
          case "${{ matrix.target }}" in
            linux-*) flutter build linux --release ;;
            windows-*) flutter build windows --release ;;
            macos-*) flutter build macos --release ;;
          esac
      - name: Build Android release APK
        if: matrix.target == 'android-apk'
        run: flutter build apk --release
      - name: Package Debian installer
        if: startsWith(matrix.target, 'linux-')
        run: |
          mkdir -p release-assets
          version="${GITHUB_REF_NAME#v}"
          bash tool/package_deb.sh \
            "build/linux/${{ matrix.flutter_arch }}/release/bundle" \
            "$version" "${{ matrix.flutter_arch }}" release-assets
      - name: Build Windows installer
        if: startsWith(matrix.target, 'windows-')
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.flutter_arch }}
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE "client/build/windows/$env:TARGET_ARCH/runner/Release"
          if (-not (Test-Path $bundle)) { throw "Missing Windows release bundle: $bundle" }
          if (-not (Get-ChildItem $bundle -Filter '*.exe' -File)) { throw "No executable found in $bundle" }
          New-Item -ItemType Directory -Force -Path 'release-assets' | Out-Null
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $programFiles = [Environment]::GetFolderPath('ProgramFiles')
          $isccCandidates = @()
          if ($programFilesX86) { $isccCandidates += (Join-Path $programFilesX86 'Inno Setup 6/ISCC.exe') }
          if ($programFiles) { $isccCandidates += (Join-Path $programFiles 'Inno Setup 6/ISCC.exe') }
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host '::error title=Inno Setup::Compiler not found. Checked: ' ($isccCandidates -join '; ')
            throw 'Inno Setup compiler not found in Program Files'
          }
          Write-Host "Using Inno Setup compiler: $iscc"
          Write-Host "Packaging bundle: $bundle"
          $compilerArgs = @(
            "/DAppVersion=`"$version`""
            "/DTargetArch=`"$env:TARGET_ARCH`""
            "/DBundleDir=`"$bundle`""
            'tool/windows-installer.iss'
          )
          $compileOutput = @(& $iscc @compilerArgs 2>&1)
          $compileExitCode = $LASTEXITCODE
          $compileOutput | ForEach-Object { Write-Host $_ }
          if ($compileExitCode -ne 0) {
            Write-Host "::error title=Inno Setup::Exit code $compileExitCode; compiler $iscc; target $env:TARGET_ARCH; bundle $bundle"
            foreach ($line in $compileOutput) {
              $safe = ([string]$line) -replace '%', '%25' -replace '\r', '%0D' -replace '\n', '%0A'
              Write-Host "::error title=Inno Setup::$safe"
            }
            throw "Inno Setup failed with exit code $compileExitCode"
          }
      - name: Package macOS disk image
        if: startsWith(matrix.target, 'macos-')
        env:
          TARGET_ARCH: ${{ matrix.flutter_arch }}
        run: |
          app_bundle=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app_bundle"
          mkdir -p release-assets dmg-staging
          cp -R "$app_bundle" dmg-staging/QuickSend.app
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "QuickSend ${GITHUB_REF_NAME}" -srcfolder dmg-staging -ov -format UDZO \
            "release-assets/QuickSend-${GITHUB_REF_NAME}-macos-${TARGET_ARCH}.dmg"
      - name: Stage Android APK
        if: matrix.target == 'android-apk'
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release-assets/QuickSend-${GITHUB_REF_NAME}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: QuickSend-${{ github.ref_name }}-${{ matrix.target }}
          path: client/release-assets/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish preview release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          sha256sum -- * > SHA256SUMS
      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: QuickSend ${{ github.ref_name }} — 预览版
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: release-assets/*
          body: |
            **QuickSend v2.1.0 预览版——非稳定版，尚非生产就绪。**

            包含中文 Flutter 客户端、可配置接收目录、传输完成后的路径显示/桌面端打开文件夹。Windows 提供安装程序 EXE，Linux 提供 DEB 安装包，macOS 提供带“应用程序”快捷方式的 DMG，另含 Android APK。

            安全提示：严格保密模式对文件内容和名称端到端加密，但中继仍能看到文件大小等元数据。高速模式的文件内容会以明文通过局域网中继，仅限可信网络，切勿用于敏感文件。

            限制：
            - Windows/macOS 安装包未签名，系统可能显示安全警告；Android APK 未使用生产签名密钥，不能用于 Play 商店发布。
            - 因未配置发布者的 Apple 签名身份和配置文件，不提供 iOS 包。
            - CI 构建并不代表真实设备已验证；LAN 发现、安装与传输的实机测试仍未完成，且尚无独立安全审计。
            - 尚未实现移动端后台传输。防火墙、访客 Wi-Fi 隔离、VPN 或子网边界可能阻止 UDP 自动发现，可手动填写 IP。
            - 请仅在可信局域网与可信对象间使用，并使用高熵随机房间密钥。

            `SHA256SUMS` 列出了所有发布文件的校验值。
