name: Build and publish installers

on:
  push:
    tags: ['v1.0.*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:desktop -- --win --x64
      - uses: actions/upload-artifact@v4
        with:
          name: QuickSend-Windows-x64
          path: dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:desktop -- --mac --x64 --arm64
      - uses: actions/upload-artifact@v4
        with:
          name: QuickSend-macOS
          path: dist/*.dmg
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run cap:sync
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: QuickSend-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    needs: [windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: QuickSend ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/**
          body: |
            QuickSend installers for Windows, macOS Intel/Apple Silicon, and Android.

            - Windows and macOS packages are unsigned; the OS may show a first-run security warning.
            - Android is a debug-signed APK for direct installation/testing, not Google Play distribution. Allow installing unknown apps for the package source.
            - Android is a client: enter the LAN address of a computer running QuickSend in the app.
